# To use:
#
#     pre-commit run -a
#
# Or:
#
#     pre-commit install  # (runs every time you commit in git)
#
# To update this file:
#
#     pre-commit autoupdate
#
# See https://github.com/pre-commit/pre-commit

repos:
  # Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: name-tests-test
      - id: detect-private-key
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        args: ['--unsafe']  # Fixes errors parsing custom jinja templates
      # - id: check-json
      # - id: pretty-format-json
      #   args: ['--autofix']  
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      # - id: trailing-whitespace
      - id: fix-byte-order-marker

  # Ruff runs from the pixi environment, so these hooks, `pixi run lint` and CI
  # all use the one ruff pinned in pyproject.toml. Change the version there only.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: pixi run --locked ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [ python, pyi ]
      - id: ruff-format
        name: ruff format
        entry: pixi run --locked ruff format
        language: system
        types_or: [ python, pyi ]

  # Shell script linter
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # Checks for spelling mistakes
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0 
    hooks:
      - id: codespell
        args: ["--write-changes","--ignore-words=./codespell-ignore.txt"]
        exclude: \.(svg|pyc|lock|json|hrd|pgm)$
